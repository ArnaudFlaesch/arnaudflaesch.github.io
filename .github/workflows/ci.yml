name: Node.js CI

on: ["push", "workflow_dispatch"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of SonarCloud analysis

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: "npm"

      - name: Install dependencies
        # The Cypress binary (the only install script needed) is installed by the Cypress action
        run: npm ci --ignore-scripts

      - name: Lint
        run: |
          npm run lint:styles
          npm run lint:styles:report
          npm run eslint
          npm run lint:md

      - name: Build
        env:
          PORTFOLIO_GITHUB_TOKEN: ${{secrets.PORTFOLIO_GITHUB_TOKEN}}
        run: |
          npm run clean
          npm run build

      - name: Tests
        uses: cypress-io/github-action@18016a55674bd02cabf197de5762a1710cb5577c # v7.4.9
        id: e2e-tests
        with:
          browser: firefox
          config-file: cypress-test.config.ts
          start: npm start
          wait-on: "http://localhost:3000"

      - name: Generate test report
        id: generate-e2e-report
        if: always() && steps.e2e-tests.outcome == 'failure'
        run: |
          mkdir cypress/screenshots || true
          npx --no-install mochawesome-merge ./cypress/results/mochawesome-report/*.json > tests-report.json
          npx --no-install marge tests-report.json -o cypress/reports/html
          cp -r cypress/screenshots cypress/reports/html/screenshots

      - name: Upload Cypress report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.generate-e2e-report.outcome == 'success'
        with:
          name: Cypress report
          path: cypress/reports/html

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Create static folder
        env:
          PORTFOLIO_GITHUB_TOKEN: ${{secrets.PORTFOLIO_GITHUB_TOKEN}}
        if: success() && github.ref_name == 'master'
        run: |
          npm run clean
          STATIC_EXPORT=true npm run build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: success() && github.ref_name == 'master'
        with:
          path: out

  deploy:
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: test
    if: success() && github.ref_name == 'master'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
